<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar Novo Usuário</title>
  </head>
  <body>
    <h1>Criar Novo Usuário</h1>

    <form action="/api/usuarios" method="post">
      <label for="nome">Nome:</label>
      <br />
      <input type="text" id="nome" name="nome" required />
      <br />
      <label for="email">E-mail:</label>
      <br />
      <input type="email" id="email" name="email" required />
      <br /><br />
      <button type="submit">Cadastrar</button>
    </form>

    <hr />
    <!-- Botão que leva para /api/usuarios -->
    <a href="/api/usuarios">
      <button type="button">Ver Usuários</button>
    </a>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const form = document.querySelector("form");

        form.addEventListener("submit", async (event) => {
          event.preventDefault(); // evita o reload da página

          const nome = document.getElementById("nome").value;
          const email = document.getElementById("email").value;

          const response = await fetch("/api/usuarios", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ nome, email }),
          });

          const data = await response.json();
          console.log("Usuário criado:", data);

          // opcional: mostrar uma mensagem para o usuário
          alert(`Usuário ${data.usuario.nome} cadastrado com sucesso!`);

          // limpar o formulário
          form.reset();
        });
      });
    </script>
  </body>
</html>
