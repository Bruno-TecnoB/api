<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processando Login - Callback</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .spinner-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .callback-container {
            max-width: 500px;
            margin: 100px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .progress {
            height: 8px;
            margin: 20px 0;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="callback-container">
            <div class="spinner-container">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Carregando...</span>
                </div>
            </div>

            <h3>Processando sua autenticação</h3>
            <p>Por favor, aguarde enquanto redirecionamos você para a aplicação.</p>

            <div class="progress">
                <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar"
                    style="width: 0%"></div>
            </div>

            <div id="errorMessage" class="alert alert-danger hidden" role="alert">
                Ocorreu um erro durante o processo de autenticação. Tente novamente.
            </div>

            <div id="successMessage" class="alert alert-success hidden" role="alert">
                Autenticação realizada com sucesso! Redirecionando...
            </div>

            <button id="retryButton" class="btn btn-secondary hidden">Tentar Novamente</button>
        </div>
    </div>
</body>

</html>
